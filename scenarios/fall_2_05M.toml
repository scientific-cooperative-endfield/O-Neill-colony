# same place and view direction as hover_2_05M. The sky is not infinitely blue: it is
# spread over a large part of the view and only mildly shifted; the shadow is smaller.
name = "fall_2_05M"
width = 960
height = 540
frames = 1
quality = "high"
[station]
marker = 0.0
[camera]
kinematics = "rain"
